<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>イベント企画 壁打ちプロンプトジェネレーター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen">
    <div class="max-w-4xl mx-auto py-10 px-4 sm:px-6 lg:px-8">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-slate-900 mb-2">イベント企画 壁打ちプロンプトジェネレーター</h1>
            <p class="text-slate-600">入力項目を埋めてプロンプトを生成し、ChatGPTやClaudeなどのLLMに貼り付けて壁打ちを開始してください。<br>未定の項目は空欄のままで構いません。</p>
        </header>

        <div class="bg-white shadow-sm ring-1 ring-slate-200 rounded-xl p-6 md:p-8 mb-8">
            <form id="generatorForm" class="space-y-6">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">1. 企画のカテゴリ</label>
                        <select id="category" class="w-full rounded-md border-slate-300 shadow-sm focus:border-primary focus:ring-primary p-2 border">
                            <option value="">選択してください</option>
                            <option value="ワークショップ">ワークショップ</option>
                            <option value="イベント用グッズ">イベント用グッズ</option>
                            <option value="体験型作品">体験型作品</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">2. 対象年齢</label>
                        <select id="age" class="w-full rounded-md border-slate-300 shadow-sm focus:border-primary focus:ring-primary p-2 border">
                            <option value="">選択してください</option>
                            <option value="幼児">幼児</option>
                            <option value="小学生">小学生</option>
                            <option value="中高生">中高生</option>
                            <option value="大学生・20代">大学生・20代</option>
                            <option value="ファミリー">ファミリー</option>
                            <option value="シニア">シニア</option>
                            <option value="全年齢対象">全年齢対象</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">3. イベントの目的 (自由記述)</label>
                    <textarea id="purpose" rows="2" class="w-full rounded-md border-slate-300 shadow-sm focus:border-primary focus:ring-primary p-2 border" placeholder="例：地域の魅力を伝えるため、新しい技術に触れてもらうため"></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">4. イベント会場</label>
                        <input type="text" id="venue" class="w-full rounded-md border-slate-300 shadow-sm focus:border-primary focus:ring-primary p-2 border" placeholder="例：屋外広場、大学の体育館">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">5. 時期・開催期間・時間</label>
                        <input type="text" id="datetime" class="w-full rounded-md border-slate-300 shadow-sm focus:border-primary focus:ring-primary p-2 border" placeholder="例：11月上旬の土日、10:00〜16:00">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">6. 参加費・値段設定</label>
                        <input type="text" id="price" class="w-full rounded-md border-slate-300 shadow-sm focus:border-primary focus:ring-primary p-2 border" placeholder="例：無料、1回500円">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">7. 参加人数 (全体/1回あたり)</label>
                        <input type="text" id="capacity" class="w-full rounded-md border-slate-300 shadow-sm focus:border-primary focus:ring-primary p-2 border" placeholder="例：全体300人、1回あたり15人">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">8. イベントの主催・運営主体</label>
                        <input type="text" id="organizer" class="w-full rounded-md border-slate-300 shadow-sm focus:border-primary focus:ring-primary p-2 border" placeholder="例：大学の研究室、地元自治体">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">9. 参加者の費やせる時間</label>
                        <input type="text" id="duration" class="w-full rounded-md border-slate-300 shadow-sm focus:border-primary focus:ring-primary p-2 border" placeholder="例：約30分、通りすがりに5分程度">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">10. 参加者の体験価値 (持ち帰る感情や学び)</label>
                    <textarea id="value" rows="2" class="w-full rounded-md border-slate-300 shadow-sm focus:border-primary focus:ring-primary p-2 border" placeholder="例：自分でも作れるという達成感、驚き"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">11. 利用可能な予算・機材・スタッフ</label>
                    <textarea id="resources" rows="2" class="w-full rounded-md border-slate-300 shadow-sm focus:border-primary focus:ring-primary p-2 border" placeholder="例：プロジェクター2台、学生スタッフ3名"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">12. 現在一番悩んでいること</label>
                    <textarea id="worry" rows="2" class="w-full rounded-md border-slate-300 shadow-sm focus:border-primary focus:ring-primary p-2 border" placeholder="例：子供向けになりすぎて大人が退屈しないか心配"></textarea>
                </div>

                <div class="pt-4 text-center">
                    <button type="button" onclick="generatePrompt()" class="bg-primary hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-lg shadow-md transition duration-200">
                        プロンプトを生成する
                    </button>
                </div>
            </form>
        </div>

        <div id="outputArea" class="hidden bg-slate-800 rounded-xl p-6 md:p-8 shadow-lg relative">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-white">生成されたプロンプト</h2>
                <button onclick="copyToClipboard()" class="bg-slate-600 hover:bg-slate-500 text-white text-sm py-1.5 px-4 rounded transition duration-200 flex items-center">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                    コピーする
                </button>
            </div>
            <textarea id="resultText" class="w-full h-96 bg-slate-900 text-slate-300 p-4 rounded border border-slate-700 focus:outline-none focus:border-slate-500 font-mono text-sm" readonly></textarea>
            <p id="copyMessage" class="text-green-400 text-sm mt-2 text-right hidden">クリップボードにコピーしました！</p>
        </div>
    </div>

    <script>
        const systemInstruction = `# 役割
あなたはイベント企画のアイデアをブラッシュアップする「壁打ちパートナー（ファシリテーター）」です。
ユーザーが自ら最高のアイデアを導き出せるよう、思考の整理と深掘りをサポートします。

# ルール（厳守事項）
1. 基本は引き出し役に徹する: 初期段階から完成形の答えを押し付けず、ユーザーが自ら気づきを得るためのサポートに徹してください。
2. 短く簡潔に: ユーザーは長い文章を読みません。出力は指定されたフォーマット通りに短くまとめてください。
3. 膠着状態の打破（適度な提案）: 議論が平行線になるのを防ぐため、やり取りが数回（目安として4〜5回以降）進んだ後や、ユーザーが迷っている様子の時は、これまでの会話を踏まえた「具体的なアイデアの種（簡単な提案）」を提示し、議論のたたき台にしてください。
4. 提案の連続は禁止（流動性の確保）: 提案はランダムなタイミングで行い、機械的なサイクルにならないようにしてください。また「連続しての提案」は絶対に行わず、一度提案した次のターンは必ずヒアリング（質問のみ）に戻ってください。
5. 必ず2つの質問: 毎回必ず、ユーザーの思考を広げる、あるいは焦点を絞るための質問を「2つだけ」投げかけてください。
6. 肯定と可能性の探求: 極端な誘導や否定は禁止です。
7. 空欄への対応: 最初の入力で「空欄（未定）」の項目がある場合、無理に埋めさせようとせず、会話の文脈に合わせて自然に埋まるような質問を適宜混ぜてください。

# 出力フォーマット
【フィードバック＆アドバイス】
（ユーザーの入力に対する短い肯定的なフィードバックとアドバイス。最大3〜4文程度で簡潔に）

【アイデアの種（※必要なタイミングのみ）】
（※ルール3, 4に従い、提案を行うターンのみ出力。それまでの文脈を踏まえた具体的なアイデア案を簡潔に1〜2つ提示する。不要なターンはこの項目ごと省略すること）

【深掘りのための質問】
1. （質問1）
2. （質問2）

---
`;

        function getValue(id) {
            const val = document.getElementById(id).value.trim();
            return val === "" ? "（未定・空欄）" : val;
        }

        function generatePrompt() {
            const promptText = `以下のイベント企画について壁打ちをお願いします。

1. 企画のカテゴリ：${getValue('category')}
2. 対象年齢：${getValue('age')}
3. イベントの目的：${getValue('purpose')}
4. イベント会場：${getValue('venue')}
5. 時期・開催期間・時間：${getValue('datetime')}
6. 参加費：${getValue('price')}
7. 参加人数：${getValue('capacity')}
8. イベントの主催・運営主体：${getValue('organizer')}
9. 参加者が費やせる想定時間：${getValue('duration')}
10. 参加者の体験価値：${getValue('value')}
11. 予算・機材・スタッフ等：${getValue('resources')}
12. 現在一番悩んでいること：${getValue('worry')}`;

            const finalOutput = systemInstruction + "\n" + promptText;
            
            document.getElementById('resultText').value = finalOutput;
            document.getElementById('outputArea').classList.remove('hidden');
            
            document.getElementById('outputArea').scrollIntoView({ behavior: 'smooth' });
        }

        function copyToClipboard() {
            const copyText = document.getElementById("resultText");
            copyText.select();
            document.execCommand("copy");
            
            const msg = document.getElementById("copyMessage");
            msg.classList.remove("hidden");
            setTimeout(() => {
                msg.classList.add("hidden");
            }, 3000);
        }
    </script>
</body>
</html>
